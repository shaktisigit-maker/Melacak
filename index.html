<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertanyaan Penting!</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ffe6e6;
            text-align: center;
        }
        h1 { color: #d63031; }
        .btn-container {
            margin-top: 20px;
            position: relative;
            width: 300px;
            height: 150px;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            position: absolute;
        }
        #btn-mau {
            background-color: #2ecc71;
            color: white;
            left: 20px;
        }
        #btn-gak {
            background-color: #e74c3c;
            color: white;
            right: 20px;
            transition: 0.1s ease;
        }
    </style>
</head>
<body>

    <h1 id="teks">Mau maafin aku gak? 🥺</h1>

    <div class="btn-container">
        <button id="btn-mau" onclick="dimaafin()">Mau</button>
        <button id="btn-gak" onmouseover="kabur()" onclick="kabur()">Gak!</button>
    </div>

    <script>
        function kabur() {
            const btnGak = document.getElementById('btn-gak');
            const x = Math.floor(Math.random() * (window.innerWidth - 100));
            const y = Math.floor(Math.random() * (window.innerHeight - 50));
            
            btnGak.style.position = 'fixed';
            btnGak.style.left = x + 'px';
            btnGak.style.top = y + 'px';
        }

        function dimaafin() {
            document.getElementById('teks').innerText = "YAY! Makasih yaa! 🥰❤️";
            document.querySelector('.btn-container').style.display = 'none';
        }
    </script>

</body>
</html>
