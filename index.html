<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEM KEAMANAN</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #0d1117; color: #ff4d4d; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; position: relative; }
        .box { border: 2px solid #500; padding: 25px; border-radius: 12px; background-color: #1a0000; text-align: center; box-shadow: 0 0 20px rgba(255,0,0,0.5); max-width: 90%; width: 320px; z-index: 10; }
        button { background-color: #8b0000; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        #progressContainer { width: 100%; background-color: #300; border-radius: 8px; margin-top: 15px; display: none; }
        #progressBar { width: 0%; height: 20px; background-color: #ff4d4d; border-radius: 8px; text-align: center; line-height: 20px; color: white; font-size: 12px; }
        .virus { position: absolute; top: -50px; font-size: 24px; z-index: 1; animation: fall linear infinite; }
        @keyframes fall { to { transform: translateY(105vh); } }
        .layar-rusak { background-color: #200 !important; animation: blink 0.1s infinite; }
        @keyframes blink { 0% { background-color: #500; } 50% { background-color: #000; } 100% { background-color: #500; } }
        #notifBox { position: fixed; top: 20px; width: 80%; background: #222; border: 1px solid #fff; padding: 15px; border-radius: 10px; display: none; z-index: 100; color: white; }
    </style>
</head>
<body>
    <div id="notifBox"><strong>MAMAH:</strong> "Cepetan transfer duitnya sekarang! Penting banget!"</div>
    <div class="box" id="mainBox">
        <h2>SISTEM KEAMANAN PUSAT</h2>
        <p>Masukkan Nomor HP untuk Verifikasi:</p>
        <input type="text" id="targetInput" placeholder="08xxxxxxxxxx" style="width: 90%; padding: 8px; background: #000; color: white; border: 1px solid #500;">
        <br>
        <button id="btnLacak" onclick="mulaiPrank()">VERIFIKASI DATA</button>
        <div id="progressContainer"><div id="progressBar">0%</div></div>
        <p id="statusText" style="font-size: 12px; color: #ff6666; margin-top: 10px;"></p>
    </div>
    
    <audio id="audioAlert" src="https://www.soundjay.com/human/sounds/scream-01.mp3" loop></audio>
    
    <script>
        const audio = document.getElementById('audioAlert');
        
        function mulaiPrank() {
            const input = document.getElementById('targetInput').value;
            if(!input || input.length < 5) { alert("Masukkan nomor valid!"); return; }
            
            audio.volume = 0; audio.play().catch(e => console.log("Wait for click"));
            document.getElementById('btnLacak').style.display = 'none';
            document.getElementById('progressContainer').style.display = 'block';
            
            // Step 1: Munculin Notif Palsu
            setTimeout(() => { document.getElementById('notifBox').style.display = 'block'; }, 2000);
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += 5;
                document.getElementById('progressBar').style.width = progress + '%';
                document.getElementById('progressBar').innerText = progress + '%';
                
                if (progress == 40) document.getElementById('statusText').innerText = "Menyadap Rekening...";
                if (progress == 80) document.getElementById('statusText').innerText = "Mengambil Data...";
                if (progress >= 100) { clearInterval(interval); eksekusiVirus(); }
            }, 300);
        }

        function eksekusiVirus() {
            audio.volume = 1; audio.play();
            document.body.classList.add('layar-rusak');
            document.getElementById('notifBox').style.display = 'none';
            setInterval(buatVirus, 100);
            document.getElementById('mainBox').innerHTML = `<h1 style="color:red;">⚠️ HACKED! ⚠️</h1><p>Sistem Anda telah diambil alih!</p><button onclick="location.reload()">RESTART</button>`;
        }

        function buatVirus() {
            const virus = document.createElement('div'); virus.classList.add('virus');
            virus.innerText = ['☣️', '☠️', '⚠️', '💸'].sort(() => 0.5 - Math.random())[0];
            virus.style.left = Math.random() * 100 + 'vw';
            virus.style.animationDuration = Math.random() * 2 + 1 + 's';
            document.body.appendChild(virus);
            setTimeout(() => virus.remove(), 3000);
        }
    </script>
</body>
</html>
